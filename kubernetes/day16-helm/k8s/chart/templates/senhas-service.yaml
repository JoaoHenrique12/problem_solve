apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.giropops-senhas.name }}
  labels:
    app: giropops-senhas
spec:
  selector:
    app: giropops-senhas
  type: {{ .Values.giropops-senhas.service.type }}
  ports:
    - protocol: TCP
      nodePort: 32500
      port: {{ .Values.giropops-senhas.service.port }}
      targetPort: {{ .Values.giropops-senhas.service.targetPort }}
      name: {{ .Values.giropops-senhas.service.name }}
